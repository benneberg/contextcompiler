name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package with all dev dependencies (ruff, mypy, pytest, coverage)
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Ruff
        run: ruff format --check .

      - name: Type check with MyPy
        run: mypy ccc/

      - name: Run tests with Coverage
        run: |
          pytest tests/ -v \
            --cov=ccc \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage to Codecov
        # Only upload coverage once, on the latest Python version
        if: matrix.python-version == '3.12' && github.event_name != 'pull_request'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
