[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc-contextcompiler"
version = "0.1.0"
description = "Generate structured, LLM-optimized context from codebases and workspaces"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lukas B" }]
requires-python = ">=3.10"

keywords = [
    "llm", "context", "code-analysis", "developer-tools",
    "ai", "codebase", "workspace", "pkml",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

# All dependencies are optional — core works with zero installs
dependencies = ['tomli>=2.0.0; python_version < "3.11"']

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
watch = ["watchdog>=3.0"]
ai = ["anthropic>=0.25", "openai>=1.0"]
all = ["pyyaml>=6.0", "watchdog>=3.0", "anthropic>=0.25", "openai>=1.0"]
dev = [
    "pyyaml>=6.0",
    "watchdog>=3.0",
    "anthropic>=0.25",
    "openai>=1.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
ccc = "ccc.cli:main"

[project.urls]
Homepage = "https://github.com/benneberg/contextcompiler"
Repository = "https://github.com/benneberg/contextcompiler"
Issues = "https://github.com/benneberg/contextcompiler/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["ccc", "ccc.*"]
namespaces = false

[tool.setuptools.package-data]
ccc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by ruff format
    "B008",  # do not perform function calls in default arguments (common in Click/argparse)
]

[tool.ruff.lint.isort]
known-first-party = ["ccc"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
